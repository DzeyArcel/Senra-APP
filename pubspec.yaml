name: senra_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  # -----------------------------
  # FIREBASE
  # -----------------------------
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4

  # -----------------------------
  # NOTIFICATIONS
  # -----------------------------
  flutter_local_notifications: ^17.1.2

  # -----------------------------
  # UTILITIES
  # -----------------------------
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  external_app_launcher: ^4.0.3
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  network_info_plus: ^7.0.0
  shared_preferences: ^2.5.3

  mobile_scanner: ^3.5.5
  audioplayers: ^5.2.1
  vibration: ^2.0.1
  
  flutter_map: ^6.1.0
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0


flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/alert.wav
